<!-- src/app/pages/registro-alumno/registro-alumno.component.html -->
<div class="page-container">

  <!-- Encabezado -->
  <header class="page-header">
    <div>
      <h1 class="page-title">Registrar alumno</h1>
      <p class="text-muted">Completa los datos del nuevo alumno</p>
    </div>
    <a routerLink="/dashboard" class="btn btn-secondary btn-inline">← Volver</a>
  </header>

  <!-- Tarjeta del formulario -->
  <div class="card form-card">
    <form (ngSubmit)="onSubmit(formRegistro)" #formRegistro="ngForm" novalidate>

      <!-- Fila 1: Nombre y Apellido Paterno -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre(s) *</label>
          <input
            id="nombre"
            type="text"
            class="form-input"
            name="nombre"
            [(ngModel)]="alumno.nombre"
            placeholder="Ej. Juan Carlos"
            autocomplete="given-name"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="apellidoPaterno">Apellido paterno *</label>
          <input
            id="apellidoPaterno"
            type="text"
            class="form-input"
            name="apellidoPaterno"
            [(ngModel)]="alumno.apellidoPaterno"
            placeholder="Ej. Pérez"
            autocomplete="family-name"
            required
          />
        </div>
      </div>

      <!-- Fila 2: Apellido Materno y Correo -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="apellidoMaterno">Apellido materno</label>
          <input
            id="apellidoMaterno"
            type="text"
            class="form-input"
            name="apellidoMaterno"
            [(ngModel)]="alumno.apellidoMaterno"
            placeholder="Ej. López"
            autocomplete="additional-name"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="correo">Correo electrónico *</label>
          <input
            id="correo"
            type="email"
            class="form-input"
            name="correo"
            [(ngModel)]="alumno.correo"
            placeholder="alumno@escuela.edu.mx"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <!-- Fila 3: Matrícula y Grupo -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="matricula">Matrícula *</label>
          <input
            id="matricula"
            type="text"
            class="form-input"
            name="matricula"
            [(ngModel)]="alumno.matricula"
            placeholder="Ej. 2024001"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="grupoId">Grupo escolar *</label>
          <select
            id="grupoId"
            class="form-input"
            name="grupoId"
            [(ngModel)]="alumno.grupoId"
            required
          >
            <option [ngValue]="null" disabled>Selecciona un grupo…</option>
            <option *ngFor="let g of grupos" [ngValue]="g.id">{{ g.nombre }}</option>
          </select>
        </div>
      </div>

      <!-- Mensajes -->
      <p class="error-message" *ngIf="errorMensaje">{{ errorMensaje }}</p>
      <p class="exito-message" *ngIf="exitoMensaje">{{ exitoMensaje }}</p>

      <!-- Acciones -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary btn-inline" (click)="limpiarFormulario(formRegistro)">
          Limpiar
        </button>
        <button type="submit" class="btn btn-primary btn-inline" [disabled]="cargando">
          {{ cargando ? 'Guardando...' : 'Registrar alumno' }}
        </button>
      </div>
    </form>
  </div>
</div>
