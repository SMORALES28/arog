<!-- src/app/pages/login/login.component.html -->
<div class="auth-container">
  <div class="card auth-card">
    <h1 class="auth-title">Pase de Lista</h1>
    <p class="auth-subtitle">Inicia sesión para continuar</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>

      <div class="form-group">
        <label class="form-label" for="usuario">Usuario</label>
        <input
          id="usuario"
          type="text"
          class="form-input"
          name="usuario"
          [(ngModel)]="usuario"
          placeholder="Ingresa tu usuario"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          class="form-input"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        />
      </div>

      <p class="error-message" *ngIf="errorMensaje">{{ errorMensaje }}</p>

      <button
        type="submit"
        class="btn btn-primary mt-2"
        [disabled]="cargando"
      >
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

      <p class="text-center mt-3">
        <a routerLink="/recuperar-password" class="text-muted">
          ¿Olvidaste tu contraseña?
        </a>
      </p>
    </form>
  </div>
</div>
