<!-- src/app/pages/dashboard/dashboard.component.html -->
<div class="page-container">

  <!-- ======= Encabezado con acciones ======= -->
  <header class="page-header">
    <div>
      <h1 class="page-title">Panel de control</h1>
      <p class="text-muted">Selecciona un grupo para ver sus alumnos</p>
    </div>

    <div class="header-actions">
      <a routerLink="/registro-alumno" class="btn btn-secondary btn-inline">
        + Registrar alumno
      </a>
      <a routerLink="/escanear-qr" class="btn btn-secondary btn-inline">
        Escanear QR
      </a>
      <a routerLink="/generar-qr" class="btn btn-secondary btn-inline">
        Generar QR
      </a>
    </div>
  </header>

  <!-- ======= Estado de carga ======= -->
  <div class="loading" *ngIf="cargando">
    <p class="text-muted">Cargando grupos…</p>
  </div>

  <!-- ======= Grid de grupos ======= -->
  <section *ngIf="!cargando" class="grupos-grid">
    <a
      *ngFor="let grupo of grupos"
      [routerLink]="['/grupo', grupo.id]"
      class="grupo-card card"
    >
      <div class="grupo-card-header">
        <h2 class="grupo-nombre">{{ grupo.nombre }}</h2>
        <span class="badge" [class.badge-matutino]="grupo.turno === 'Matutino'"
              [class.badge-vespertino]="grupo.turno === 'Vespertino'">
          {{ grupo.turno }}
        </span>
      </div>

      <div class="grupo-card-body">
        <span class="grupo-count">{{ grupo.totalAlumnos }}</span>
        <span class="grupo-label">alumnos</span>
      </div>

      <div class="grupo-card-footer">
        <span>Ver alumnos →</span>
      </div>
    </a>
  </section>

  <!-- ======= Estado vacío ======= -->
  <div *ngIf="!cargando && grupos.length === 0" class="empty-state card">
    <p class="text-muted">No hay grupos registrados todavía.</p>
  </div>

</div>
